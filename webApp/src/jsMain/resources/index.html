<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PandaZOO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#5E9068">
    <meta name="description" content="Gestiona tu zoo de pandas y otros animales.">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="icons/icono-192.png">
    <link rel="apple-touch-icon" href="icons/icono-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="PandaZOO">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: #FFFFFF; }
        @media (prefers-color-scheme: dark) { html, body { background: #121412; } }
        body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
    </style>
    <script src="sql-wasm-browser.js"></script>
    <script src="pandazoo.js" defer></script>
</head>
<body>
<script>
    // Funciona sin conexión tras la primera visita y permite instalar la app en la pantalla de inicio.
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
            navigator.serviceWorker.register("sw.js").catch(function (e) { console.warn("PandaZOO: sin service worker", e); });
        });
    }
</script>
</body>
</html>
