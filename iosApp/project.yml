# Definición del proyecto Xcode para XcodeGen (https://github.com/yonaskolb/XcodeGen).
# En un Mac:  brew install xcodegen && cd iosApp && xcodegen generate && open iosApp.xcodeproj
name: iosApp
options:
  bundleIdPrefix: com.pandazoo
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"          # solo iPhone (RES-02)
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes:
          - Info.plist
    info:
      path: iosApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pandazoo.app
        INFOPLIST_FILE: iosApp/Info.plist
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared-ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework SharedUi"
    preBuildScripts:
      - name: Compilar la interfaz compartida (Kotlin)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared-ui:embedAndSignAppleFrameworkForXcode
